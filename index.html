<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurama AI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Bibliothèque d'icônes FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Menu latéral (Sidebar pour l'historique) -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Historique</h3>
            <button id="close-sidebar" class="icon-btn">✕</button>
        </div>
        <div id="history-list" class="history-list">
            <!-- Les anciennes sessions chargeront ici via Supabase -->
        </div>
    </div>

    <!-- Interface principale du Chat -->
    <div class="chat-container">
        <header class="chat-header">
            <!-- Bouton obligatoire pour forcer l'ouverture du menu -->
            <button id="open-sidebar" class="menu-trigger-btn">MENU</button>
            <h1>Kurama <span class="badge">Alpha Code</span></h1>
            <button id="new-chat" class="icon-btn">+</button>
        </header>

        <main id="chat-box" class="chat-box">
            <!-- Les bulles de messages apparaîtront ici -->
        </main>

        <footer class="chat-footer">
            <div class="input-area">
                <textarea id="user-input" placeholder="Posez votre question de codage à Kurama..." rows="1"></textarea>
                <button id="send-btn" type="button">➤</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
